name: CD - Simulated Deployment

on:
  push:
    branches:
      - demo/dag5
      - demo/dag6
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops25-app .

      - name: Start application
        run: docker run -d --name devops25-app -p 8000:8000 devops25-app

      - name: Verify deployment
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Deployment verified successfully"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Deployment verification failed"
          docker logs devops25-app
          exit 1

      - name: Verify deployed version
        run: |
          set -o pipefail
          echo "Checking deployed application version..."
          curl --fail --silent --show-error http://localhost:8000/version
          echo
          curl --fail --silent --show-error \
            http://localhost:8000/version | python3 -c \
            'import json,sys; data=json.load(sys.stdin); assert data["version"] == "1.1"'
          echo "Correct application version deployed"

      - name: Stop application
        if: always()
        run: docker rm -f devops25-app || true
