name: CI Pipeline

on:
  push:
    branches:
      - main
      - "demo/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, Lint and Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: warn

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Build Docker image
        run: docker build -t devops25-app:ci .

      - name: Start Docker container
        run: docker run -d --name devops25-ci -p 8000:8000 devops25-app:ci

      - name: Verify application
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Application verified successfully"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          docker logs devops25-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f devops25-ci || true
